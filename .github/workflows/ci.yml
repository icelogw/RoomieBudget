name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: only the latest commit
# is worth spending minutes on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests, types and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ci rather than install: installs exactly what the lockfile says and
      # fails if package.json and the lockfile disagree.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Deliberately run with no SESSION_SECRET. The build must not need one —
      # configuration belongs to the running container, not to the image — and
      # this is what stops that regressing.
      - name: Production build
        run: npm run build

  image:
    name: Container image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: this proves the Dockerfile still works, which
      # typecheck and tests cannot tell you. A broken Dockerfile would
      # otherwise only surface when trying to update the server.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: roomiebudget:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building an image says nothing about whether it starts. A container
      # that crash-loops on the documented quickstart passed every other check
      # here and reached a tagged release, so the quickstart itself is now the
      # test: only SESSION_SECRET set, exactly as the README says.
      - name: Boot on the documented quickstart
        run: |
          set -euo pipefail

          docker run -d --name ci-boot -p 3000:3000 \
            -e SESSION_SECRET="$(openssl rand -base64 48)" \
            roomiebudget:ci

          for attempt in $(seq 1 30); do
            if ! docker ps --filter name=ci-boot --filter status=running -q | grep -q .; then
              echo "Container exited before serving a request:"
              docker logs ci-boot
              exit 1
            fi

            if curl -fsS -m 3 http://localhost:3000/api/health > /tmp/health.json 2>/dev/null; then
              echo "Healthy after ${attempt}s: $(cat /tmp/health.json)"
              exit 0
            fi

            sleep 1
          done

          echo "Never became healthy. Logs:"
          docker logs ci-boot
          exit 1

      - name: Container logs
        if: always()
        run: docker logs ci-boot 2>&1 | tail -30 || true

      - name: Tear down
        if: always()
        run: docker rm -f ci-boot || true
