name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest

    permissions:
      # Needed to create the release. Nothing else is granted.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the generated notes can see what changed since
          # the previous tag.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # A tag that does not build is worse than no tag: somebody will deploy
      # it. Everything is verified before the release exists.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: roomiebudget:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The gh CLI is on the runner, so no third-party action is needed to
      # cut the release — one less thing in the supply chain.
      #
      # An annotated tag carries its own message, and that becomes the release
      # notes. A plain tag has nothing to say, so the notes are generated from
      # the commits instead. Which is wanted differs by release: a first
      # release wants prose, a patch wants the commit list.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          message=$(git tag -l --format='%(contents)' "$TAG" | tr -d '[:space:]')

          if [ "$(git cat-file -t "$TAG")" = "tag" ] && [ -n "$message" ]; then
            echo "Annotated tag with a message — using it as the release notes."
            gh release create "$TAG" --title "$TAG" --notes-from-tag --verify-tag
          else
            echo "Plain tag — generating notes from the commits."
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
