# Development. Everything runs in the container, so there is no need for Node
# on the host and no chance of dev and production disagreeing.
#
#   docker compose -f docker-compose.dev.yml up
#
# Source is bind-mounted, so edits on the host reload in the container.

services:
  dev:
    build:
      context: .
      target: dev
    container_name: roomiebudget-dev

    # Turbopack has no polling mode, and bind mounts on Windows and macOS do
    # not deliver inotify events — so it never sees a host edit. webpack does
    # support polling, which is the only watcher that works through a bind
    # mount. Slower to compile, but it actually reloads.
    command: npx next dev --webpack -H 0.0.0.0

    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATA_DIR: /data
      TZ: ${TZ:-Australia/Sydney}
      APP_URL: ${APP_URL:-http://localhost:3000}

      # Bind mounts on Windows and macOS do not deliver inotify events, so the
      # dev server never sees a file change. Polling is slower but is the only
      # thing that works reliably across hosts.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"

      # Mail goes to the catcher below rather than anywhere real. Read it at
      # http://localhost:8025 — nothing leaves the machine.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      MAIL_FROM: no-reply@roomiebudget.local

    volumes:
      # The project, so edits on the host are visible inside the container.
      - .:/app

      # These two must be container-owned, not bind-mounted from the host.
      # node_modules holds Linux-native binaries for better-sqlite3 and argon2;
      # letting the host's Windows build shadow them crashes the server on
      # boot. .next is excluded for speed and for the same cross-platform
      # reason.
      - node_modules:/app/node_modules
      - next_cache:/app/.next

      # The database, kept on the host so it survives a rebuild.
      - ./data:/data

    depends_on:
      - mailpit

  # A second copy of the app on its own database, filled with a plausible
  # sharehouse. Lets the interface be judged with real content in it without
  # putting demo bills anywhere near ./data.
  #
  #   npm run seed:demo   (fills ./data-demo)
  #   npm run demo        (serves it on :3001)
  #
  # Behind a profile so it never starts with the normal dev stack.
  demo:
    profiles: ["demo"]
    build:
      context: .
      target: dev
    container_name: roomiebudget-demo
    command: npx next dev --webpack -H 0.0.0.0
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      DATA_DIR: /data
      TZ: ${TZ:-Australia/Sydney}
      APP_URL: http://localhost:3001
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: no-reply@roomiebudget.local
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - demo_next_cache:/app/.next
      - ./data-demo:/data
    depends_on:
      - mailpit

  # Development only. Catches every outgoing email and shows it in a web
  # inbox, so notification changes can be checked without sending anything to
  # a real address or configuring a relay.
  mailpit:
    image: axllent/mailpit:latest
    container_name: roomiebudget-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"  # web inbox
      - "1025:1025"  # SMTP

volumes:
  node_modules:
  next_cache:
  demo_next_cache:
